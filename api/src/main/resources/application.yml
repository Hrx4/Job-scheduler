server:
  port: ${API_PORT:8080}

spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jobs}
    username: ${DB_USER:jobs}
    password: ${DB_PASSWORD:jobs}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

api:
  keys: ${API_KEYS:dev-key}   # comma-separated

# Off by default: scheduler + worker services run jobs. Set true to run jobs inside the API
# process with no Kafka (handy for quick local dev and the API tests).
local-worker:
  enabled: ${LOCAL_WORKER_ENABLED:false}
  threads: 8
  poll-interval-ms: 500
  lease-seconds: 30

jobs:
  retry:
    base-ms: 10000
    cap-ms: 600000

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-} run=%X{runId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
