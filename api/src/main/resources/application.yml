server:
  port: ${API_PORT:8080}

spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobs}
    username: ${DB_USER:jobs}
    password: ${DB_PASSWORD:jobs}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
