server:
  port: ${WORKER_PORT:8082}

spring:
  application:
    name: worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jobs}
    username: ${DB_USER:jobs}
    password: ${DB_PASSWORD:jobs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: workers
      auto-offset-reset: earliest
      enable-auto-commit: false   # commit only after the claim succeeds
      max-poll-records: 50
      properties:
        # How fast Kafka notices a crashed worker and moves its partitions. Default 45 s made the
        # re-queued run wait for that rebalance: crash-to-rerun was ~44 s. See DECISIONS.md ADR-009.
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
      # After a nack (worker full) the consumer is paused and only resumes when poll() returns.
      # The default 5 s timeout left free threads idle for ~5 s; see DECISIONS.md ADR-017.
      poll-timeout: 200ms

worker:
  id: ${WORKER_ID:}            # blank = hostname; a random suffix is always added
  consumers: 3                 # Kafka consumer threads; total across workers is capped by 12 partitions
  handler-threads: 8           # jobs running at once in this instance

jobs:
  lease-seconds: 30            # claim lease; each heartbeat pushes it this far ahead
  heartbeat-interval-ms: 10000 # 3 beats per lease, so one or two missed beats are survivable
  retry:
    base-ms: 10000
    cap-ms: 600000

logging:
  pattern:
    level: "%5p [run=%X{runId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
