server:
  port: ${WORKER_PORT:8082}

spring:
  application:
    name: worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobs}
    username: ${DB_USER:jobs}
    password: ${DB_PASSWORD:jobs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: workers
      auto-offset-reset: earliest
      enable-auto-commit: false   # commit only after the claim succeeds
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

worker:
  id: ${WORKER_ID:}            # blank = hostname; a random suffix is always added
  consumers: 3                 # Kafka consumer threads; total across workers is capped by 12 partitions
  handler-threads: 8           # jobs running at once in this instance
  lease-seconds: 30

jobs:
  retry:
    base-ms: 10000
    cap-ms: 600000

logging:
  pattern:
    level: "%5p [run=%X{runId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
