# Infra only by default:      docker compose up -d
# Infra + the three services: docker compose --profile apps up -d --build
name: job-scheduler

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 12
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes: [./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: [./ops/grafana/provisioning:/etc/grafana/provisioning:ro]
    depends_on: [prometheus]

  # ---- application services (profile "apps") ----
  api:
    profiles: [apps]
    build: { context: ., args: { MODULE: api } }
    ports: ["8080:8080"]
    environment: &app-env
      DB_URL: jdbc:postgresql://postgres:5432/jobs
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }

  scheduler:
    profiles: [apps]
    build: { context: ., args: { MODULE: scheduler } }
    ports: ["8081:8081"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      api: { condition: service_started }   # api runs Flyway

  worker:
    profiles: [apps]
    build: { context: ., args: { MODULE: worker } }
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    deploy:
      replicas: 2   # scale with: docker compose --profile apps up -d --scale worker=4

volumes:
  pgdata:
