global:
  scrape_interval: 5s

# Targets are Docker Compose service names (docker compose --profile apps up).
# "worker" uses DNS discovery: Docker's DNS returns one IP per replica, so every
# worker is scraped even after --scale worker=N.
#
# Running services from Maven on the host instead? Point targets at
# host.docker.internal:8080 / 8081 / 8082.
scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]

  - job_name: scheduler
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["scheduler:8081"]

  - job_name: worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8082
        refresh_interval: 10s
